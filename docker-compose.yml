services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutorslot
      POSTGRES_USER: tutorslot
      POSTGRES_PASSWORD: tutorslot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorslot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tutorslot:tutorslot@postgres:5432/tutorslot
    depends_on:
      postgres:
        condition: service_healthy
    # Host port 8001 avoids clashing with the local app already on 8000.
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # Open the app at http://localhost:3000
    ports:
      - "3000:8080"

volumes:
  postgres-data:
