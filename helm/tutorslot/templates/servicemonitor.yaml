{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tutorslot-backend
  labels:
    # Matches the Prometheus Operator's serviceMonitorSelector release label.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tutorslot-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
